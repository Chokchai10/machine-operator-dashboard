<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><title>ระบบข้อมูลพนักงานขับเครื่องจักร</title><link rel="stylesheet" href="dashboard.css"></head><body>
<header><div class="wrap"><div class="top"><div><div class="tag">⛑ SITE OPERATIONS</div><h1 data-i18n="title"></h1><p data-i18n="subtitle"></p></div><div class="head-actions"><div class="language"><button data-lang="th">ไทย</button><button data-lang="en">EN</button><button data-lang="zh">中文</button></div><div id="date" class="date"></div><div class="header-buttons"><button id="calendarButton" class="ghost"></button><button id="adminButton" class="ghost"></button><button id="addButton" class="add" hidden></button></div></div></div><input id="search" class="search" data-i18n-placeholder="search"></div></header>
<main class="wrap"><div id="adminNotice" class="admin-notice"></div><div id="stats" class="stats"></div><div id="tabs" class="tabs"></div><div class="filters"><select id="type"></select><select id="company"></select><label><input type="checkbox" id="ot"><span data-i18n="onlyOt"></span></label><label><input type="checkbox" id="broken"><span data-i18n="onlyBroken"></span></label></div><div id="content"></div></main><footer data-i18n="footer"></footer>
<div class="modal" id="adminModal"><form class="box small-box" id="adminForm"><div class="box-head"><h2 data-i18n="adminLogin"></h2><button type="button" class="close" data-close="adminModal">✕</button></div><p data-i18n="pinHelp"></p><input id="pinInput" class="pin-input" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required><p id="pinError" class="error-text"></p><button class="save wide" data-i18n="unlock"></button></form></div>
<div class="modal" id="formModal"><form class="box" id="form"><div class="box-head"><div><div class="tag">EMPLOYEE PROFILE</div><h2 id="formTitle"></h2></div><button type="button" class="close" data-close="formModal">✕</button></div><label class="upload" for="photo"><span id="previewText"></span><img id="preview" hidden><input id="photo" type="file" accept="image/*"></label><div class="form" id="fields"></div></form></div>
<div class="modal" id="detailModal"><div class="box detail-box"><div class="box-head"><h2 id="detailTitle"></h2><button class="close" data-close="detailModal">✕</button></div><div id="detailBody"></div></div></div>
<div class="modal" id="calendarModal"><div class="box calendar-box"><div class="box-head"><div><div class="tag">WORK CALENDAR</div><h2 data-i18n="calendar"></h2></div><button class="close" data-close="calendarModal">✕</button></div><div class="calendar-nav"><button id="prevMonth">‹</button><strong id="calendarTitle"></strong><button id="nextMonth">›</button></div><div class="calendar-week" id="calendarWeek"></div><div class="calendar-grid" id="calendarGrid"></div><div id="calendarEmployees" class="calendar-employees"></div></div></div>
<script src="supabase-config.js"></script><script src="dashboard.js"></script></body></html>
